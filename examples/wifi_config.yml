# shulid WiFi configuration: WPA2/WPA3-Personal and open networks.
#
# Shulid targets small systems that do not want to run Nipart for full
# network management. Hence only the most common use cases are provided:
# fully static and fully dynamic IP configuration.
---
version: 1
# Roaming (per SSID): when the current AP's signal (dBm) drops below
# the threshold while connected, the client scans and roams to a better
# BSS (Fast BSS Transition inside a mobility domain, full
# reauthentication otherwise). Enabled by default with iwd's default
# threshold of -70 dBm. BSS Transition Management (802.11v) requests
# are honoured regardless.
wifis:
  # A single `WifiClient` runs for the whole daemon: every interface in
  # this network namespace shares one client and one event
  # subscription. Entries with the same `interface` (explicit or
  # resolved from `any`) share one scan schedule; different interfaces
  # connect concurrently. The `interface: any` (or absent) entries all
  # bind to the first available WiFi interface.
  - ssid: Test-WIFI
    password: "12345678"
    # bssid: 02:00:00:00:00:11 # pin to one AP (no failover to other
    #                          # BSSes of the same SSID)
    # sae_password_id: corp-id # optional SAE password identifier (H2E-only)
    # ocv: true # operating channel validation
    # ext_key_id: true # extended key id (driver must support it)
    # roaming: true
    # roaming_threshold: -70
    # prefered: true # choose this SSID over stronger APs of other
    #                # configured SSIDs while its signal is usable
    # wowlan: true # arm WoWLAN (disconnect + GTK rekey failure) while
    #              # connected; off by default
    dns:
      nameservers:
        - 2001:db8:1::254
        - 192.0.2.1
      searches:
        - example.org
        - example.net
    ipv4:
      auto: false # full static configuration
      address:
        - ip: 192.0.2.251
          prefix-length: 24
      gateway: 192.0.2.1
    ipv6:
      auto: false
      address:
        - ip: 2001:db8:1::1
          prefix-length: 64
      gateway: 2001:db8:1::254
  - ssid: Test-WIFI-OPEN
    interface: any
    # hidden: true  # AP does not broadcast its SSID; probe by name
    ipv4:
      auto: true
    ipv6:
      auto: true
  # A second NIC: managed by the same WifiClient concurrently with the
  # ones above.
  # - ssid: Test-WIFI-2
  #   password: "12345678"
  #   interface: wlan1
  #   ipv4:
  #     auto: true
  #   ipv6:
  #     auto: true
