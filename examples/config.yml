# Shulid is targeting small system which don't want to run Nipart for
# full feature network management. Hence we only provides the suppport
# of most-common use case: full static and full dynamic.
---
version: 1
# Roaming (per SSID): when the current AP's signal (dBm) drops below
# the threshold while connected, the client scans and roams to a better
# BSS (Fast BSS Transition inside a mobility domain, full
# reauthentication otherwise). Enabled by default with iwd's default
# threshold of -70 dBm. BSS Transition Management (802.11v) requests
# are honoured regardless.
wifis:
  # One `WifiClient` runs per distinct interface: entries with the same
  # `interface` (explicit or resolved from `any`) share one client and
  # scan schedule, different interfaces connect concurrently.  The
  # `interface: any` (or absent) entries all bind to the first
  # available WiFi interface; Test-WIFI omits the key, Test-WIFI-OPEN
  # spells it out.
  - ssid: Test-WIFI
    password: "12345678"
    # roaming: true
    # roaming_threshold: -70
    # wowlan: true # arm WoWLAN (disconnect + GTK rekey failure) while
    #              # connected; off by default
    dns:
      nameservers:
        - 2001:db8:1::254
        - 192.0.2.1
      searches:
        - example.org
        - example.net
    ipv4:
      auto: false # full static configuration
      address:
        - ip: 192.0.2.251
          prefix-length: 24
      gateway: 192.0.2.1
    ipv6:
      auto: false
      address:
        - ip: 2001:db8:1::1
          prefix-length: 64
      gateway: 2001:db8:1::254
  - ssid: Test-WIFI-OPEN
    interface: any
    ipv4:
      auto: true
    ipv6:
      auto: true
  # A second NIC: its networks run in a second WifiClient concurrently
  # with the ones above.
  # - ssid: Test-WIFI-2
  #   password: "12345678"
  #   interface: wlan1
  #   ipv4:
  #     auto: true
  #   ipv6:
  #     auto: true
