[package]
name = "shuli"
description = "WiFi authentication library (WPA3-SAE, OWE, open)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
# Tests are unit tests declared as `mod tests` in lib.rs, not
# integration tests in the tests/ directory.
autotests = false


[lib]
name = "shuli"
path = "lib.rs"

[dependencies]
wl-nl80211.workspace = true
tokio.workspace = true
log.workspace = true
futures.workspace = true
netlink-packet-core.workspace = true
netlink-packet-generic.workspace = true
genetlink.workspace = true
netlink-proto.workspace = true
netlink-sys.workspace = true
p256.workspace = true
getrandom.workspace = true
aws-lc-rs.workspace = true
libc.workspace = true
rustls.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
env_logger.workspace = true
